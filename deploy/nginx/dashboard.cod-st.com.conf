# Nginx server block for dashboard.cod-st.com (terminates TLS, proxies to app).
# Point the dashboard.cod-st.com A record at the Contabo IP (161.97.160.73).
# Obtain certs first with deploy/init-letsencrypt.sh (see DEPLOYMENT.md).

# ---- HTTP: ACME challenge + redirect everything else to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.cod-st.com;

    # Let's Encrypt webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: reverse proxy to the FastAPI app ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.cod-st.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.cod-st.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.cod-st.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (basic hardening).
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Large CSV uploads (hundreds of thousands of rows).
    client_max_body_size 200m;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / long-poll support (future-proofing).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Sane timeouts.
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
