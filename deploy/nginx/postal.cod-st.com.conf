# Reverse proxy for the Postal admin UI/API at postal.cod-st.com.
# Postal v3 runs on the HOST network (port 5000); this nginx container reaches it
# via host.docker.internal (host-gateway). Port 5000 itself is closed to the
# public by ufw — only this proxy and the host can reach it.

server {
    listen 80;
    listen [::]:80;
    server_name postal.cod-st.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name postal.cod-st.com;

    ssl_certificate     /etc/letsencrypt/live/postal.cod-st.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postal.cod-st.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Postal serves message attachments / large emails through its UI.
    client_max_body_size 50m;

    location / {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
    }
}
