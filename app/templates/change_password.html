{% extends "base.html" %}
{% block title %}Change password — {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Change your password</h1>
  <p class="muted">You must set a new password before continuing.</p>
  <form method="post" action="/change-password">
    <label>Current password
      <input type="password" name="current_password" required autofocus>
    </label>
    <label>New password (min 10 characters)
      <input type="password" name="new_password" required minlength="10">
    </label>
    <label>Confirm new password
      <input type="password" name="confirm_password" required minlength="10">
    </label>
    <button type="submit" class="btn btn-primary">Update password</button>
  </form>
</div>
{% endblock %}
